[project]
name = "mebeauty-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Irina Lebedeva", email = "dr.irina.lebedeva@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=1.24.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
]

[project.scripts]
mebeauty-benchmark = "mebeauty_benchmark:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
