[project]
name = "mebeauty-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Irina Lebedeva", email = "dr.irina.lebedeva@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=1.24.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.0.0",
]

[project.scripts]
mebeauty-benchmark = "mebeauty_benchmark:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
# `slow` covers the end-to-end method tests: they download pretrained weights
# and fine-tune for one epoch, so they take ~30s rather than ~2s. Deselected by
# default so `make check` stays fast; `make test-slow` runs them, and CI should
# run both. They are the tests that catch a method being unable to run at all,
# so "deselected by default" must not become "never run".
markers = ["slow: end-to-end, needs pretrained weights (run with -m slow)"]
addopts = "-m 'not slow'"
