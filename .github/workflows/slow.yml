name: End-to-end

# The slow suite downloads the dataset and pretrained weights and trains each
# method for one epoch. It is the only thing that catches a method that cannot
# run at all, so it must not be "skipped by default" forever -- it runs weekly
# and on demand.
on:
  # The weekly schedule is disabled. With HF_TOKEN configured the suite
  # authenticates and trains, but twenty methods for one epoch each does not
  # fit in 90 minutes on a CPU runner -- it was cancelled at the timeout, so
  # the schedule only produced failure mail. Restore the cron once the suite
  # is scoped to fit (see issue #7).
  # schedule:
  #   - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  end-to-end:
    # The scheduled run needs HF_TOKEN, which a fork does not have, so it
    # would fail weekly in every fork. Manual runs are always allowed.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.repository == 'dr-irina-lebedeva/MEBeauty-Benchmark'
    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26 from
    # 19 October 2026, and this job should not change underneath a result.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - name: Every method fits and predicts
        env:
          # The dataset is gated; a read token is needed to fetch it.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run pytest -m slow -q
